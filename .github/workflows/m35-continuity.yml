name: Proof Estate Public Evidence Integrity
on:
  push:
    branches: [main]
    paths:
      - 'milestones/**'
      - 'proofs/**'
      - 'examiner/**'
      - 'category/**'
      - 'kcd/**'
      - 'challenges/**'
      - 'scripts/**'
      - 'README.md'
      - 'index.html'
      - 'foundation.html'
      - 'end-to-end.html'
      - 'proof-estate-manifest.json'
      - '*.png'
      - '*.jpg'
      - '*.svg'
      - '.github/workflows/m35-continuity.yml'
      - '.github/workflows/issue-fresh-challenge.yml'
  pull_request:
    paths:
      - 'milestones/**'
      - 'proofs/**'
      - 'examiner/**'
      - 'category/**'
      - 'kcd/**'
      - 'challenges/**'
      - 'scripts/**'
      - 'README.md'
      - 'index.html'
      - 'foundation.html'
      - 'end-to-end.html'
      - 'proof-estate-manifest.json'
      - '*.png'
      - '*.jpg'
      - '*.svg'
      - '.github/workflows/m35-continuity.yml'
      - '.github/workflows/issue-fresh-challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check manual challenge syntax without triggering external issue comments
        run: python3 scripts/test_issue_fresh_workflow_expressions.py
      - name: Parse public inline JavaScript without executing the site
        run: node scripts/validate_public_script_syntax.mjs
      - name: Test malformed-script and external-script negative controls
        run: node scripts/test_validate_public_script_syntax.mjs
      - name: Confirm formal NEW-K source identities and exported claim carrier hashes
        run: python3 scripts/validate_public_formal_sources.py
      - name: Test original-PDF hash and formal-claim evidence boundaries
        run: python3 scripts/test_validate_public_formal_sources.py
      - name: Confirm released website and carrier checksum
        run: python3 scripts/validate_public_register.py
      - name: Validate source-bound continuity and public home navigation
        run: python3 scripts/validate_m34_continuity.py
      - name: Run tampering and stale-status negative controls
        run: python3 scripts/test_validate_m34_continuity.py
      - name: Verify local links and anchor navigation across public estate
        run: python3 scripts/validate_public_links.py
      - name: Verify website release identity and immutable checksum lineage
        run: python3 scripts/validate_public_release_identity.py
      - name: Test release version, checksum and historical-reference drift detection
        run: python3 scripts/test_validate_public_release_identity.py
      - name: Verify archived website releases against original Git commits
        run: python3 scripts/verify_public_release_history.py
      - name: Test forged publication history rejection
        run: python3 scripts/test_verify_public_release_history.py
      - name: Verify original public image bytes and preview dimensions
        run: python3 scripts/validate_public_media_assets.py
      - name: Reject tampered published media and missing icons
        run: python3 scripts/test_validate_public_media_assets.py
      - name: Check public pages against unapproved runtime data transmission
        run: python3 scripts/validate_static_public_safety.py
      - name: Test negative controls for external runtime calls and uploads
        run: python3 scripts/test_validate_static_public_safety.py
      - name: Verify scientific-cycle handoff and dated evidence snapshot scope
        run: python3 scripts/validate_scientific_cycle_consistency.py
      - name: Test stale HOLD and false-scientific-promotion negative controls
        run: python3 scripts/test_validate_scientific_cycle_consistency.py
