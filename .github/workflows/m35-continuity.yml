name: M35 Public Evidence Continuity Integrity
on:
  push:
    branches: [main]
    paths:
      - 'milestones/**'
      - 'proofs/**'
      - 'examiner/**'
      - 'scripts/validate_m34_continuity.py'
      - 'scripts/test_validate_m34_continuity.py'
      - 'README.md'
      - 'index.html'
      - 'proof-estate-manifest.json'
      - '.github/workflows/m35-continuity.yml'
  pull_request:
    paths:
      - 'milestones/**'
      - 'proofs/**'
      - 'examiner/**'
      - 'scripts/validate_m34_continuity.py'
      - 'scripts/test_validate_m34_continuity.py'
      - 'README.md'
      - 'index.html'
      - 'proof-estate-manifest.json'
      - '.github/workflows/m35-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm released website and carrier checksum
        run: python3 scripts/validate_public_register.py
      - name: Validate source-bound continuity and public home navigation
        run: python3 scripts/validate_m34_continuity.py
      - name: Run tampering and stale-status negative controls
        run: python3 scripts/test_validate_m34_continuity.py
