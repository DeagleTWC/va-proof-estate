name: Public Proof Integrity
on:
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - "proof-estate-manifest.json"
      - "index.html"
      - "scripts/validate_public_register.py"
      - "scripts/validate_v12_evidence.py"
      - "scripts/validate_source_transcripts.py"
      - "scripts/validate_historical_public_surfaces.py"
      - "scripts/validate_historical_carriers.py"
      - "scripts/test_historical_carriers.py"
      - "scripts/historical_freeze_inventory.py"
      - "scripts/test_historical_freeze_inventory.py"
      - "scripts/multi_pilot_evidence_audit.py"
      - "scripts/test_multi_pilot_evidence_audit.py"
      - "examiner/byo_workflow_evidence.py"
      - "examiner/byo_workflow_sample.py"
      - "examiner/test_byo_workflow_evidence.py"
      - "scripts/validate_third_party_review.py"
      - "scripts/test_third_party_review.py"
      - "scripts/validate_historical_source_families.py"
      - "scripts/test_historical_source_families.py"
      - ".github/workflows/public-proof-integrity.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "proof-estate-manifest.json"
      - "index.html"
      - "scripts/validate_public_register.py"
      - "scripts/validate_v12_evidence.py"
      - ".github/workflows/public-proof-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-carriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce and check bounded synthetic proof
        run: python proofs/VA-AD-001/verify.py
      - name: Verify original-source transcript identity and page coverage
        run: python scripts/validate_source_transcripts.py
      - name: Verify historical source revisions are not relabeled as original freezes
        run: python scripts/validate_historical_public_surfaces.py
      - name: Verify historical carrier release admission and negative controls
        run: |
          python scripts/validate_historical_carriers.py
          python scripts/test_historical_carriers.py
      - name: Verify offline historical inventory, tampering and no false promotion
        run: python scripts/test_historical_freeze_inventory.py
      - name: Test isolated historic multi-pilot source roles and promotion guards
        run: python scripts/test_multi_pilot_evidence_audit.py
      - name: Verify BYO applicant real-workflow evidence packet and negative controls
        run: |
          python examiner/test_byo_workflow_evidence.py
          python examiner/byo_workflow_sample.py --out /tmp/deagle-byo-synthetic-reference
          python examiner/byo_workflow_evidence.py --packet /tmp/deagle-byo-synthetic-reference
      - name: Verify third-party historic evidence custody and reject false promotion
        run: |
          python scripts/validate_third_party_review.py
          python scripts/test_third_party_review.py
      - name: Verify historical source family classification
        run: |
          python scripts/validate_historical_source_families.py
          python scripts/test_historical_source_families.py
      - name: Enforce authentic native V12 evidence promotion and reject false claims
        run: python scripts/validate_v12_evidence.py
      - name: Verify public manifest and claim-register integrity
        run: python scripts/validate_public_register.py
