name: BYO seam synthetic examination
on:
  push:
    paths:
      - 'examiner/**'
      - '.github/workflows/byo-seam.yml'
  workflow_dispatch:
jobs:
  synthetic-interface-examination:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Positive seam examination
        run: |
          python examiner/byo_seam.py --out /tmp/positive.json --adapter python examiner/example_layer.py > /dev/null
          python -c 'import json; r=json.load(open("/tmp/positive.json")); assert r["pass_count"]==r["case_count"]==6'
      - name: Unsafe adapter negative control must fail
        run: |
          if python examiner/byo_seam.py --out /tmp/negative.json --adapter python examiner/negative_layer.py > /dev/null; then
            echo "FAIL: unsafe adapter unexpectedly passed"
            exit 1
          fi
          python -c 'import json; r=json.load(open("/tmp/negative.json")); assert r["pass_count"] < r["case_count"]'
      - name: Generated changed-condition and reroute stress matrix
        run: |
          python examiner/adversarial_matrix.py --seed 20261024 --rounds 4 --out /tmp/matrix.json --adapter python examiner/example_layer.py > /dev/null
          python -c 'import json; r=json.load(open("/tmp/matrix.json")); assert r["pass_count"]==r["case_count"]==36'
          python examiner/verify_matrix.py /tmp/matrix.json --adapter python examiner/example_layer.py
      - name: Generated matrix must reject unsafe adapter
        run: |
          if python examiner/adversarial_matrix.py --seed 20261024 --rounds 4 --out /tmp/unsafe-matrix.json --adapter python examiner/negative_layer.py > /dev/null; then
            echo "FAIL: unsafe layer passed generated matrix"
            exit 1
          fi
          python -c 'import json; r=json.load(open("/tmp/unsafe-matrix.json")); assert r["pass_count"]==8 and r["case_count"]==36'
      - name: Report verifier must detect tampering
        run: |
          python -c 'import json; p="/tmp/matrix.json"; o=json.load(open(p)); o["cases"][0]["passed"]=False; json.dump(o,open("/tmp/tampered.json","w"))'
          if python examiner/verify_matrix.py /tmp/tampered.json; then
            echo "FAIL: tampered packet was accepted"
            exit 1
          fi
      - name: Stateful sequence - single-process ticket use, substitution and revocation
        run: |
          python examiner/session_challenge.py --seed 20261024 --rounds 2 --out /tmp/session.json --adapter python examiner/session_reference.py > /dev/null
          python -c 'import json; r=json.load(open("/tmp/session.json")); assert r["event_count"]==54 and r["pass_count"]==54'
          python examiner/verify_session.py /tmp/session.json --adapter python examiner/session_reference.py
      - name: Stateful unsafe adapter must be rejected
        run: |
          if python examiner/session_challenge.py --seed 20261024 --rounds 2 --out /tmp/broken-session.json --adapter python examiner/session_broken.py > /dev/null; then
            echo "FAIL: unsafe stateful adapter unexpectedly passed"
            exit 1
          fi
          python -c 'import json; r=json.load(open("/tmp/broken-session.json")); assert r["pass_count"]<r["event_count"]'
      - name: Stateful receipt mutation must be detected
        run: |
          python -c 'import json; x=json.load(open("/tmp/session.json")); x["observations"][0]["passed"]=False; json.dump(x,open("/tmp/session-mutated.json","w"))'
          if python examiner/verify_session.py /tmp/session-mutated.json; then
            echo "FAIL: modified stateful report was accepted"
            exit 1
          fi
      - name: Do not promote synthetic result to physical or native V.A. proof
        run: |
          python -c 'import json; r=json.load(open("/tmp/positive.json")); assert "NOT NATIVE V.A." in r["examiner_scope"]'
